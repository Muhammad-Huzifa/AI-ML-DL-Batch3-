name: Course checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate course materials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/validation.txt
      - name: Install classroom and validation dependencies
        run: python -m pip install -r requirements.txt -r requirements/validation.txt
      - name: Check notebook syntax, links, data paths, and slides
        run: python scripts/check_course.py
      - name: Execute selected CPU examples
        run: python scripts/run_cpu_examples.py
